[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl-analytics"
version = "0.1.0"
description = "Reproducible NHL roster and statistics ingestion"
requires-python = ">=3.12"
dependencies = ["requests>=2.32,<3", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2", "pyarrow>=20,<30"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.9,<4"]
api = ["fastapi>=0.162,<1", "uvicorn>=0.54,<1", "httpx2>=2.16,<3"]

[project.scripts]
nhl-fetch = "nhl_analytics.ingest:main"
nhl-db = "nhl_analytics.database:main"
nhl-moneypuck = "nhl_analytics.moneypuck:main"
nhl-game-logs = "nhl_analytics.game_logs:main"
nhl-schedules = "nhl_analytics.schedules:main"
nhl-standings = "nhl_analytics.team_context:main"
nhl-names = "nhl_analytics.names:main"
nhl-health = "nhl_analytics.health:main"
nhl-features = "nhl_analytics.features:main"
nhl-reconstruct = "nhl_analytics.reconstructed:main"
nhl-baselines = "nhl_analytics.baselines:main"
nhl-evaluate = "nhl_analytics.evaluation:main"
nhl-api = "nhl_analytics.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nhl_analytics = ["migrations/*.sql"]
